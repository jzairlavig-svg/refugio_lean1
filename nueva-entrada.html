<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva entrada</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span>••• 📶 🔋</span>
    </div>

    <div class="header">
      <button class="back-button" onclick="window.location.href='index.html'">&larr; Nueva entrada</button>
    </div>

    <main class="content">
      <textarea id="texto-entrada" class="textarea-entrada" placeholder="¿Qué tienes en mente hoy?"></textarea>
      <button id="btn-guardar" class="btn-dark">Guardar</button>
    </main>

    <div class="footer-bar">
      <div class="home-indicator"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById("btn-guardar").addEventListener("click", () => {
      const texto = document.getElementById("texto-entrada").value.trim();
      if (!texto) {
        alert("Escribe algo antes de guardar.");
        return;
      }
      sessionStorage.setItem("texto_borrador", texto);
      window.location.href = "estado-animo.html";
    });
  </script>
</body>
</html>
