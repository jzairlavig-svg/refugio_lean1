<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¿Cómo te sientes?</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span>••• 📶 🔋</span>
    </div>

    <main class="content mood-screen">
      <div class="mood-badge">📔 Mi diario personal</div>
      <h1 class="mood-question">¿Cómo te sientes en este momento?</h1>
      <p class="mood-subtext">Un breve registro para tu espacio de calma.</p>

      <div class="mood-options" id="mood-options">
        <button class="mood-option" data-valor="0">😞</button>
        <button class="mood-option" data-valor="1">🙁</button>
        <button class="mood-option selected" data-valor="2">😐</button>
        <button class="mood-option" data-valor="3">🙂</button>
        <button class="mood-option" data-valor="4">😄</button>
      </div>
      <div class="mood-scale-labels">
        <span>Muy bajo</span>
        <span>Muy bien</span>
      </div>

      <div class="mood-actions">
        <button id="btn-continuar" class="btn-dark">Continuar</button>
      </div>
    </main>

    <div class="footer-bar">
      <div class="home-indicator"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let moodSeleccionado = 2;

    document.querySelectorAll(".mood-option").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".mood-option").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        moodSeleccionado = Number(btn.dataset.valor);
      });
    });

    document.getElementById("btn-continuar").addEventListener("click", () => {
      const texto = sessionStorage.getItem("texto_borrador") || "";
      sessionStorage.removeItem("texto_borrador");

      agregarEntrada({ texto, mood: moodSeleccionado });

      if (necesitaAcompanamiento()) {
        window.location.href = "acompanamiento.html";
      } else {
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
